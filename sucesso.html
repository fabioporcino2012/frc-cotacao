<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pagamento Confirmado 🎉 – Florida Rental Car</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#111b21;color:#e9edef;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;}
  .icon{font-size:72px;margin-bottom:16px;animation:pop .5s ease;}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  h1{color:#25d366;font-size:1.6rem;margin-bottom:8px;}
  p{color:#8696a0;font-size:15px;line-height:1.6;max-width:320px;margin:0 auto 24px;}
  .card{background:#1f2c34;border-radius:14px;padding:20px;max-width:340px;width:100%;margin-bottom:20px;}
  .card p{color:#e9edef;font-size:14px;text-align:left;margin:0;}
  .card p+p{margin-top:8px;}
  .btn{display:block;background:#25d366;color:#111;font-weight:800;font-size:16px;
    padding:16px;border-radius:12px;text-decoration:none;max-width:340px;width:100%;margin:0 auto;}
  .btn:active{opacity:.85;}
  .frc{font-size:12px;color:#3a4a56;margin-top:24px;}
</style>
</head>
<body>
<div class="icon">🎉</div>
<h1>Pagamento Confirmado!</h1>
<p>Sua reserva foi recebida com sucesso. Nossa equipe vai entrar em contato no seu WhatsApp em até <strong style="color:#25d366">30 minutos</strong>.</p>

<div class="card" id="details">
  <p>🏎️ Carregando detalhes...</p>
</div>

<a href="https://wa.link/8x8bbz" class="btn">💬 Falar com a equipe agora</a>

<p class="frc">Florida Rental Car © 2026</p>

<script>
const q = new URLSearchParams(window.location.search);
const cotacaoId = q.get('cotacao');
if (cotacaoId) {
  fetch(`https://abjzskmxfcqsxcoybsdg.supabase.co/rest/v1/hq_cotacoes?id=eq.${cotacaoId}&select=nome,vehicle_nome,local_nome,pickup_date,return_date,dias,total_brl_com_desconto,total_brl,total_usd`, {
    headers: {
      'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFianpza214ZmNxc3hjb3lic2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzODUzMDEsImV4cCI6MjA4OTk2MTMwMX0.66vI8Aqm9bzi8K9YW-pHGhSWr5ufoG_9i6jei2m9kAA'
    }
  }).then(r => r.json()).then(d => {
    const c = d && d[0];
    if (!c) return;
    const pDate = c.pickup_date ? new Date(c.pickup_date).toLocaleDateString('pt-BR') : '?';
    const rDate = c.return_date ? new Date(c.return_date).toLocaleDateString('pt-BR') : '?';
    const total = c.total_brl_com_desconto || c.total_brl || (c.total_usd * 5.8);
    document.getElementById('details').innerHTML = `
      <p>👤 ${c.nome || 'Cliente'}</p>
      <p>🚗 ${c.vehicle_nome || ''}</p>
      <p>📍 ${c.local_nome || ''}</p>
      <p>📅 ${pDate} → ${rDate} (${c.dias} dias)</p>
      <p>💵 R$ ${total ? total.toFixed(0) : '—'}</p>
    `;
  }).catch(() => {});
}
</script>
</body>
</html>
