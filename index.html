<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Florida Rental Car — Cotação Online</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#111b21;--header:#1f2c34;--bubble-in:#202c33;--bubble-out:#005c4b;
    --green:#25d366;--text:#e9edef;--muted:#8696a0;--border:#2a3942;--red:#7D1202;
  }
  html{background:#0b141a;min-height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;
    background:var(--bg);height:100dvh;display:flex;flex-direction:column;
    max-width:430px;margin:0 auto;position:relative;overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6);}

  /* ── HEADER ──────────────────────────────────────────────────── */
  .hdr{background:var(--header);padding:10px 14px;display:flex;align-items:center;
    gap:10px;border-bottom:1px solid var(--border);z-index:20;flex-shrink:0;}
  .hdr-av{width:42px;height:42px;border-radius:50%;background:var(--red);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;flex-shrink:0;overflow:hidden;}
  .hdr-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .hdr-inf{flex:1;min-width:0;}
  .hdr-name{color:var(--text);font-size:15.5px;font-weight:600;line-height:1.2;}
  .hdr-status{color:var(--green);font-size:11px;}
  .hdr-ic{display:flex;gap:16px;align-items:center;}
  .hdr-ic a{color:var(--muted);text-decoration:none;display:flex;transition:.15s;}
  .hdr-ic a:hover{color:var(--text);}

  /* ── CHAT ────────────────────────────────────────────────────── */
  .chat{flex:1;overflow-y:auto;padding:10px 8px 80px;scroll-behavior:smooth;}
  .chat::-webkit-scrollbar{display:none;}

  /* ── BUBBLES ─────────────────────────────────────────────────── */
  .msg{display:flex;margin:2px 0;animation:pop .25s ease;}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
  .msg.in{justify-content:flex-start;}
  .msg.out{justify-content:flex-end;}
  .bbl{max-width:82%;padding:8px 10px 6px;border-radius:7.5px;
    font-size:14.5px;line-height:1.45;position:relative;word-break:break-word;}
  .in .bbl{background:var(--bubble-in);color:var(--text);border-top-left-radius:0;}
  .out .bbl{background:var(--bubble-out);color:var(--text);border-top-right-radius:0;}
  .bbl b{font-weight:600;}
  .t{font-size:10.5px;color:var(--muted);float:right;margin-left:8px;margin-top:3px;}

  /* ── TYPING ──────────────────────────────────────────────────── */
  .typing{display:flex;align-items:center;gap:4px;padding:12px 14px;
    background:var(--bubble-in);border-radius:7.5px;border-top-left-radius:0;
    width:56px;margin:2px 0;}
  .dot{width:7px;height:7px;background:var(--muted);border-radius:50%;
    animation:bounce 1.3s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  /* ── CAR CARD ────────────────────────────────────────────────── */
  .car-wrap{max-width:84%;margin:3px 0;}
  .car-card{background:var(--bubble-in);border-radius:10px;overflow:hidden;
    border:1.5px solid var(--border);cursor:pointer;transition:.15s;}
  .car-card:hover,.car-card:active{border-color:var(--green);}
  .car-card.rec{border-color:var(--green);}
  .car-badge{background:var(--green);color:#111;font-size:11px;font-weight:800;
    padding:4px 10px;letter-spacing:.5px;}
  .car-img{width:100%;height:130px;background:#1a2430;
    display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;}
  .car-img img{width:100%;height:100%;object-fit:cover;}
  .car-body{padding:10px 12px 12px;}
  .car-name{color:var(--text);font-size:15px;font-weight:700;}
  .car-icons{color:var(--muted);font-size:12px;margin-top:3px;}
  .car-price{color:var(--green);font-size:20px;font-weight:800;margin-top:6px;}
  .car-price span{font-size:12px;color:var(--muted);font-weight:400;}
  .car-total{color:var(--muted);font-size:12px;margin-top:2px;}
  .car-btn{display:block;background:var(--green);color:#111;font-weight:700;
    font-size:14px;text-align:center;padding:10px;border-radius:8px;
    margin:10px 12px 12px;border:none;cursor:pointer;width:calc(100% - 24px);}
  .car-btn:active{opacity:.85;}

  /* ── OPTIONS ─────────────────────────────────────────────────── */
  .opts{display:flex;flex-wrap:wrap;gap:8px;padding:6px 8px;}
  .opt{background:var(--header);border:1.5px solid var(--green);color:var(--green);
    padding:9px 16px;border-radius:20px;font-size:14px;cursor:pointer;
    font-weight:500;transition:.15s;}
  .opt:active,.opt.sel{background:var(--green);color:#111;}
  .opt.full{width:100%;text-align:center;border-radius:10px;padding:13px;}
  .opt.bold{font-weight:800;font-size:15px;}
  .opt.wa{background:var(--green);color:#fff;border:none;font-weight:800;}
  .opt.secondary{border-color:var(--muted);color:var(--muted);}

  /* ── FORM ────────────────────────────────────────────────────── */
  .frm{background:#1a2732;border-radius:10px;padding:14px;
    max-width:90%;margin:4px 0;}
  .frm label{color:var(--muted);font-size:12px;display:block;margin-bottom:4px;}
  .frm input,.frm select{width:100%;background:#2a3942;border:1.5px solid #3a4a56;
    border-radius:8px;padding:11px 14px;color:var(--text);font-size:15px;
    outline:none;margin-bottom:10px;font-family:inherit;-webkit-appearance:none;
    appearance:none;}
  .frm input:focus,.frm select:focus{border-color:var(--green);}
  .frm input::placeholder{color:var(--muted);}
  .frm .err{border-color:#ef4444!important;}
  .frm-btn{width:100%;background:var(--green);color:#111;border:none;
    border-radius:8px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;
    transition:.15s;}
  .frm-btn:active{opacity:.85;}
  .frm-btn:disabled{opacity:.55;cursor:not-allowed;}

  /* ── PAYMENT CARD ────────────────────────────────────────────── */
  .pay-card{background:#0d1f14;border:2px solid var(--green);border-radius:14px;
    padding:18px;max-width:90%;margin:4px 0;}
  .pay-lbl{color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;}
  .pay-total{color:var(--text);font-size:30px;font-weight:900;margin:6px 0;}
  .pay-sub{color:var(--muted);font-size:12.5px;margin-bottom:6px;}
  .pay-details{color:var(--muted);font-size:12.5px;line-height:1.8;}
  .pay-btn{display:block;width:100%;background:var(--green);color:#111;
    font-weight:800;font-size:16px;text-align:center;padding:15px;
    border-radius:10px;margin-top:16px;border:none;cursor:pointer;}
  .pay-btn:active{opacity:.85;}
  .pay-security{color:var(--muted);font-size:11px;text-align:center;margin-top:8px;}

  /* ── AI BADGE ────────────────────────────────────────────────── */
  .ai-b{display:inline-flex;align-items:center;gap:4px;
    background:#0d1b2a;border:1px solid #3b82f6;color:#60a5fa;
    font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:5px;}

  /* ── INPUT BAR ───────────────────────────────────────────────── */
  .bar{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
    background:var(--header);padding:9px 12px;display:flex;align-items:flex-end;
    gap:10px;border-top:1px solid var(--border);z-index:20;
    padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
    transition:bottom .1s;}
  .bar textarea{flex:1;background:#2a3942;border:none;border-radius:21px;
    padding:10px 16px;color:var(--text);font-size:15px;outline:none;
    resize:none;min-height:42px;max-height:100px;font-family:inherit;line-height:1.4;}
  .bar textarea::placeholder{color:var(--muted);}
  .bar .send{width:44px;height:44px;background:var(--green);border:none;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;font-size:20px;}
  .bar .send:active{opacity:.8;}

  /* ── iOS SAFE AREA ───────────────────────────────────────────── */
  @supports (-webkit-touch-callout:none){
    .chat{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));}
  }

  /* ── SPINNER ─────────────────────────────────────────────────── */
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── DESKTOP ─────────────────────────────────────────────────── */
  @media(min-width:431px){
    body{margin:20px auto;height:calc(100dvh - 40px);border-radius:12px;
      overflow:hidden;}
    .bar{border-radius:0 0 12px 12px;}
    .chat{padding-bottom:90px;}
  }
</style>

function stepLead() {

function validarTelefone(raw) {
  const d = raw.replace(/\D/g, '');
  if (d.length < 10) return 'Número muito curto — inclua o DDD.';
  if (d.length > 13)  return 'Número muito longo.';
  // Todos dígitos iguais: 00000000, 11111111, etc.
  if (new Set(d).size === 1) return 'Número inválido.';
  // Sequencial crescente ou decrescente nos primeiros 8 dígitos
  const seg = d.slice(0, 8);
  const crescente  = [...seg].every((c, i) => i === 0 || +c === (+seg[i-1] + 1) % 10);
  const decrescente = [...seg].every((c, i) => i === 0 || +c === ((+seg[i-1] - 1 + 10) % 10));
  if (crescente || decrescente) return 'Número inválido.';
  // DDD inválido (Brasil: DDD vai de 11 a 99, não existe 00-10)
  const ddd = parseInt(d.slice(0, 2));
  if (ddd < 11) return 'DDD inválido — inclua o código de área (ex: 11 99999-0000).';
  return null; // ✅ válido
}

window.submitLead = async function () {

  try {

    const erroTel = validarTelefone(phone);
    if (erroTel) {
      const el = document.getElementById('f-fone');
      el.classList.add('err'); el.placeholder = erroTel;
      btn.disabled = false; btn.textContent = 'Continuar →'; return;
    }
    const phoneDigits = phone.replace(/\D/g, '');

    // ── Twilio Lookup (silencioso se falhar, não bloqueia por timeout) ──
    btn.textContent = 'Verificando número... 🔍';
    try {
      const vr = await Promise.race([
        fetch(`${EDGE}/frc-phone-validate`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phoneDigits })
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000))
      ]);
      const vd = await vr.json();
      if (!vd.valid && !vd.fallback) {
        const el = document.getElementById('f-fone');
        el.classList.add('err');
        el.value = '';
        el.placeholder = vd.error || 'Número inválido. Verifique o DDD.';
        btn.disabled = false; btn.textContent = 'Continuar →'; return;
      }
    } catch (_) { /* timeout ou erro de rede — deixa passar */ }

    ctx.nome  = nome;
    ctx.phone = phoneDigits;
    ctx.email = email;
    leadCapturado = true;

    // Salvar lead + Kommo em background
    fetch(`${EDGE}/hq-step1-capture`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: nome, phone: phoneDigits, email,
        source: 'chat_cotacao', attempt_uuid: sessionId,
        utm_source: UTM.source, utm_medium: UTM.medium, utm_campaign: UTM.campaign
      })
    }).catch(() => {});

    document.getElementById('frm-lead')?.remove();
    await addMsg(`${nome} 📱 ${phone}`, 'out');
    await showTyping(900);
    await addMsg(`Prazer, <b>${nome}</b>! 🙌 Como posso te ajudar hoje?`);
    showMenu();

  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Continuar →';
    await addMsg('Algo deu errado. Pode tentar de novo? 😊');
  }
};

// STEP 2 — Datas e local de retirada
// ═══════════════════════════════════════════════════════════════════════
function stepDatas() {
  const hoje   = new Date();
  const pickup = new Date(hoje); pickup.setDate(pickup.getDate() + 14);
  const ret    = new Date(pickup); ret.setDate(ret.getDate() + 7);
  const fmt    = d => d.toISOString().split('T')[0];
  const minRet = new Date(hoje); minRet.setDate(hoje.getDate() + 1);

  const frm = document.createElement('div'); frm.className = 'frm'; frm.id = 'frm-datas';
  frm.innerHTML = `
    <label>📍 Local de retirada</label>
    <select id="f-local">
      <option value="1">Orlando — Aeroporto (MCO)</option>
      <option value="3">Miami — Aeroporto (MIA)</option>
      <option value="4">Fort Lauderdale (FLL)</option>
    </select>
    <label>📅 Data de retirada *</label>
    <input id="f-pickup" type="date" value="${fmt(pickup)}" min="${fmt(hoje)}"/>
    <label>📅 Data de devolução *</label>
    <input id="f-ret" type="date" value="${fmt(ret)}" min="${fmt(minRet)}"/>
    <button class="frm-btn" id="btn-datas" onclick="window.submitDatas()">🔍 Ver carros disponíveis</button>
  `;
  addEl(frm);

  // Sincronizar min da devolução quando pickup muda
  setTimeout(() => {
    const fpEl = document.getElementById('f-pickup');
    const frEl = document.getElementById('f-ret');
    if (fpEl && frEl) {
      fpEl.addEventListener('change', () => {
        if (fpEl.value) {
          const minD = new Date(fpEl.value); minD.setDate(minD.getDate() + 1);
          frEl.min = minD.toISOString().split('T')[0];
          if (frEl.value <= fpEl.value) {
            minD.setDate(minD.getDate() + 6);
            frEl.value = minD.toISOString().split('T')[0];
          }
        }
      });
    }
  }, 100);
}

window.submitDatas = async function () {
  const btn = document.getElementById('btn-datas');
  if (!btn || btn.disabled) return;
  btn.disabled = true; btn.textContent = '🔍 Buscando...';

  try {
    const localId = parseInt(document.getElementById('f-local')?.value || '1');
    const pickup  = document.getElementById('f-pickup')?.value;
    const ret     = document.getElementById('f-ret')?.value;

    if (!pickup || !ret) {
      btn.disabled = false; btn.textContent = '🔍 Ver carros disponíveis'; return;
    }

    const d1   = new Date(pickup + 'T12:00:00');
    const d2   = new Date(ret + 'T12:00:00');
    const dias = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));

    if (dias < 1) {
      alert('A devolução deve ser após a retirada.');
      btn.disabled = false; btn.textContent = '🔍 Ver carros disponíveis'; return;
    }

    ctx.local_id  = localId;
    ctx.local_nome = LOCAIS[localId] || 'Orlando — MCO';
    ctx.pickup    = pickup;
    ctx.retorno   = ret;
    ctx.dias      = dias;

    document.getElementById('frm-datas')?.remove();

    const pFmt = d1.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const rFmt = d2.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    await addMsg(`📍 ${ctx.local_nome}<br>📅 ${pFmt} → ${rFmt} (${dias} dia${dias > 1 ? 's' : ''})`, 'out');
    await showTyping(500);
    await addMsg('Buscando disponibilidade em tempo real... 🔍');
    await showTyping(1800);

    fetchCarros(pickup, ret, dias);

  } catch (e) {
    btn.disabled = false; btn.textContent = '🔍 Ver carros disponíveis';
    await addMsg('Tive um problema ao buscar. Pode tentar de novo? 😊');
  }
};

// STEP 3 — Lista de carros disponíveis
// ═══════════════════════════════════════════════════════════════════════
async function fetchCarros(pickup, ret, dias) {
  // Limpar carros anteriores do DOM e do registro
  document.querySelectorAll('.car-wrap').forEach(el => el.remove());
  window._cars = {};

  try {
    const r    = await fetch(`${EDGE}/hq-cotacao-engine?action=availability&pickup=${pickup}&return=${ret}&location=${ctx.local_id}`);
    const data = await r.json();
    const carros = (data.carros || []).filter(c => c.daily_usd > 0);

    if (carros.length === 0) {
      await addMsg('😕 Não encontrei carros disponíveis para essas datas. Tente outras datas ou fale com nossa equipe!');
      addEl(ctaFinalWhats([
        { label: '📅 Escolher outras datas', fn: stepDatas, full: true }
      ]));
      return;
    }

    await addMsg(`🎉 <b>${carros.length} opções</b> disponíveis para você! Escolhe o seu:`);

    carros.forEach((car, i) => {
      window._cars[car.id] = car;
      setTimeout(() => {
        const totalBRL = (car.total_brl || car.daily_usd * dias * CAMBIO_BRL);
        const wrap = document.createElement('div');
        wrap.className = 'car-wrap msg in';
        wrap.innerHTML = `
          <div class="car-card${car.recommended ? ' rec' : ''}" onclick="window.selecionarCarro(${car.id})">
            ${car.recommended ? '<div class="car-badge">⭐ MAIS ESCOLHIDO</div>' : ''}
            <div class="car-img">
              <img src="${car.thumb_url || car.image_url || ''}" onerror="this.parentNode.innerHTML='🚗'" loading="lazy"/>
            </div>
            <div class="car-body">
              <div class="car-name">${car.nome}</div>
              <div class="car-icons">${car.seats ? `👥 ${car.seats}  ` : ''}${car.bags ? `💼 ${car.bags}  ` : ''}❄️  🚗</div>
              ${car.descricao ? `<div class="car-icons" style="margin-top:3px">${car.descricao.slice(0, 80)}</div>` : ''}
              <div class="car-price">${usd(car.daily_usd)}<span>/dia</span></div>
              <div class="car-total">Total ${dias}d: <b style="color:var(--text)">${usd(car.total_usd)}</b> · ${brl(totalBRL)}</div>
              <button class="car-btn">Quero este →</button>
            </div>
          </div>`;
        addEl(wrap);

        if (i === carros.length - 1) {
          setTimeout(async () => {
            const w = document.createElement('div'); w.className = 'msg in';
            w.innerHTML = `<div class="bbl"><div class="ai-b">🤖 Melissa</div><br>Dúvidas sobre os carros? Me pergunte! Também posso verificar promoções 😊<span class="t">${nowStr()}</span></div>`;
            addEl(w);
            aiActive = true;
          }, 300);
        }
      }, i * 650);
    });

  } catch (e) {
    await addMsg('Não consegui buscar os carros agora. Nossa equipe pode te ajudar diretamente!');
    addEl(ctaFinalWhats([
      { label: '📅 Tentar outras datas', fn: stepDatas, full: true }
    ]));
  }
}

function renderMarkdown(text) {
  // Passo 1: markdown explícito primeiro (**url** e [texto](url))
  let r = text
    .replace(/\*\*(https?:\/\/[^\s*<]+)\*\*/g, '<a href="$1" target="_blank" style="color:var(--green);font-weight:700">🔗 Abrir link de pagamento</a>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--green);font-weight:700">$1</a>');
  // Passo 2: linkificar URLs nuas APENAS em partes de texto (não dentro de tags HTML já criadas)
  r = r.split(/(<[^>]+>)/).map((part, i) => {
    if (i % 2 !== 0) return part; // tag HTML — não tocar
    return part.replace(/(https?:\/\/[^\s<"]+)/g, url => {
      const isMP = url.includes('mercadopago');
      return isMP
        ? `<a href="${url}" target="_blank" style="color:var(--green);font-weight:700;text-decoration:underline">🔗 Abrir link de pagamento</a>`
        : `<a href="${url}" target="_blank" style="color:var(--green)">${url}</a>`;
    });
  }).join('');
  // Passo 3: bold e quebras de linha
  return r
    .replace(/\*\*([^*<]+)\*\*/g, '<b>$1</b>')
    .replace(/\n/g, '<br>');
}

          nome: ctx.nome, phone: ctx.phone, email: ctx.email,
          local_id: ctx.local_id, local_nome: ctx.local_nome,
          pickup: ctx.pickup, retorno: ctx.retorno, dias: ctx.dias,
          carro: ctx.carro?.nome, carro_id: ctx.carro?.id,
          total_usd: ctx.carro?.total_usd, total_brl: ctx.carro?.total_brl,
          cotacao_id: ctx.cotacao_id,
          payment_link: window._lastPayLink || null,
          payment_moeda: window._lastPayMoeda || null,
          tem_lead: leadCapturado
        }
      })
    });
    const data  = await r.json();
    const reply = data.reply || 'Pode repetir? 😊';
    aiHistory.push({ role: 'assistant', content: reply });
    await addMsg(`<div class="ai-b">🤖 Melissa</div><br>${renderMarkdown(reply)}`);

    // WhatsApp CTA — só adicionar se o último elemento ainda não for um
    const lastEl = chat.lastElementChild;
    if (!lastEl?.classList.contains('wa-cta')) {
      const waQuick = document.createElement('div');
      waQuick.className = 'opts wa-cta';
      const waBtn = document.createElement('button');
      waBtn.className = 'opt wa'; waBtn.style.cssText = 'font-size:12.5px;padding:8px 16px;';
      waBtn.textContent = '💬 Falar com atendente agora';
      waBtn.onclick = () => window.open(WA_LINK, '_blank');
      waQuick.appendChild(waBtn); addEl(waQuick);
    }

    // CTA cotação — só 1x por sessão
    if (!ctx.carro && !cotacaoSugerida && aiHistory.length >= 6) {
      cotacaoSugerida = true;
      addEl(makeOpts([
        { label: '💰 Fazer cotação agora', fn: stepDatas, full: true, bold: true },
      ]));
    }
  } catch (e) {
    await addMsg('Opa, tive uma dificuldade técnica. Pode repetir? Ou fale com nossa equipe! 😊');
    addEl(ctaFinalWhats());
  } finally {
    aiPending = false;  // libera concurrency guard
  }
}

// ─── iOS KEYBOARD FIX ─────────────────────────────────────────────────
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const keyboardH = window.innerHeight - window.visualViewport.height;
    bar.style.bottom = keyboardH > 50 ? keyboardH + 'px' : '0px';
    scroll();
  });
}

// ─── START ─────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
